      `<div class="note"><b>窗口</b>: ${P.window} ｜ <b>总换手</b>: ${P.turnover.toFixed(0)}倍 ｜ <b>曲线做法</b>: 每日收盘算六品种IC加权评分→排名; 多前2/空后2各±0.5名义; 跌出前2即平多、升出倒数2名即平空(严格排名buf=0); 信号日收盘→次日开盘成交; 收益=持仓×日收益−换手×0.02%/边; 净值=日收益复利累计; 超额=L/S−等权持有; Sharpe=年化242日; 权重=训练窗(2021-03~2024-06)因子IC带符号归一, 样本外不重估。</div>` +
      `<div class="note"><b>怎么做/为什么</b>: ①为什么做截面不做单边——有色板块同涨同跌占主导, 绝对方向被宏观(美元/利率)绑架, 相对强弱由品种自身供需(库存/升贴水/TC/成本)决定, 更适合基本面因子表达; ②为什么IC加权——让每个品种的历史数据自己投票决定哪个因子管用、什么方向管用(如铝的动量IC为负→铝按反转用), 避免拍脑袋; ③为什么v3.1改严格排名——2016长样本复核中buf=0相对buf=1逐年占优, 样本外Sharpe 1.65对0.88, 成本5bp压力情景仍为1.31; 代价是换手增加, 因此只改交易规则、不改冻结权重; ④为什么top2/bottom2——单品种对冲两腿太集中(一个印尼政策就爆), top3太稀释, 2是锐度与分散的平衡; ⑤为什么样本外单独列——权重只在训练窗估, 2024-07后表现为纯样本外检验。实盘净值不重置, 2026-10-27起从既有净值连续记账。</div>` +
      pt +
      `<h2>净值与超额</h2><img src="${D.imgs.ls}"><h2>各品种累计盈亏贡献</h2><img src="${D.imgs.contrib}">` +
      '<h2>逐因子消融（剔除该因子后 Sharpe 变化：负=该因子在贡献，正=剔除反而更好=拖油瓶）</h2>' + ab +
      '<h2>参数敏感度（单变量, 基准=buf1/topn2/2bp/floor0.01）</h2>' + prm +
      '<h2>' + D.ev_title + '</h2>' + ev +
      (D.bt_note ? `<div style="color:#999;font-size:12px;line-height:1.6">${D.bt_note}</div>` : '');
    return;
  }
  const rows = D.breakdown[sym];
  let t = '<table><tr><th>因子</th><th>训练期IC</th><th>权重(|IC|归一)</th><th>最新z</th><th>贡献(z×w)</th><th class="l2">打分逻辑</th></tr>';
  let tot = 0;
  rows.forEach(r => { tot += r.contrib;
    t += `<tr><td>${r.factor}</td><td>${r.ic.toFixed(3)}</td><td>${(r.weight*100).toFixed(0)}%</td><td>${r.z.toFixed(2)}</td><td>${r.contrib.toFixed(3)}</td><td class="l2">${D.why[sym+'|'+r.factor]||''}</td></tr>`; });
  t += `<tr><th>合计评分</th><th></th><th></th><th></th><th>${tot.toFixed(3)}</th><th></th></tr></table>`;
  mn.innerHTML = `<h2>${NAMES[sym]} · ${sym} 因子拆解 <span style="font-size:13px;color:#888">(${D.today})</span></h2>` + t +
    '<div class="note">权重由来：训练窗 2021-03~2024-06 内，因子 z 分与其后 5 日收益的相关系数(IC)带符号归一；|IC|<0.01 的因子剔除。IC 为负=该品种上该因子反向使用（如铝/锌/铅的动量=反转）。</div>' +
    `<h2>${NAMES[sym]} 持仓交互图（滚轮缩放/底部滑块拖区间；红带=持多 绿带=持空，▲开多 ▼开空 ×平仓）</h2>` +
    '<div style="color:#999;font-size:12px;margin:4px 0 8px">持仓带与开平标记为回测研究口径（全历史重跑），实盘期（2026-09-18 起）实际持仓以左侧栏与 <a href="index.html">实盘监控页</a> 为准。</div>' +
    '<div id="ec" style="width:100%;height:560px;background:#fff;border:1px solid #ddd;border-radius:8px"></div>';
  const cd = D.chart[sym];
  const ch = echarts.init(document.getElementById('ec'));
  const markAreas = cd.segs.map(g => [{xAxis: g[0], itemStyle: {color: g[2] > 0 ? 'rgba(212,63,58,0.13)' : 'rgba(58,155,92,0.13)'}}, {xAxis: g[1]}]);
  const evPts = cd.evs.map(e => {
    const i = cd.dates.indexOf(e[0]);
    if (i < 0) return null;
    return {coord: [e[0], cd.px[i]], value: e[1],
            itemStyle: {color: e[1].includes('多') ? '#d43f3a' : '#3a9b5c'}};
  }).filter(Boolean);
  ch.setOption({
    animation: false,
    grid: [{top: 40, height: '55%'}, {top: '68%', height: '22%'}],
    xAxis: [{type: 'category', data: cd.dates, gridIndex: 0}, {type: 'category', data: cd.dates, gridIndex: 1, show: false}],
    yAxis: [{scale: true, gridIndex: 0}, {scale: true, gridIndex: 1}],
    dataZoom: [{type: 'inside', xAxisIndex: [0, 1]}, {type: 'slider', xAxisIndex: [0, 1], top: '94%'}],
    tooltip: {trigger: 'axis'},
    series: [
      {name: '价格', type: 'line', data: cd.px, showSymbol: false, lineStyle: {width: 1.2}, xAxisIndex: 0, yAxisIndex: 0,
       markArea: {silent: true, data: markAreas},
       markPoint: {symbolSize: 42, label: {fontSize: 10}, data: evPts}},
      {name: '累计盈亏贡献', type: 'line', data: cd.contrib, showSymbol: false,
       lineStyle: {width: 1.2, color: '#b8860b'}, areaStyle: {opacity: 0.12}, xAxisIndex: 1, yAxisIndex: 1},
    ],
  }, true);
}
render();
</script></body></html>
