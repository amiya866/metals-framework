<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>有色截面配置 · 实盘监控</title>
<script src="echarts.min.js"></script>
<style>
body{font-family:'Microsoft YaHei',sans-serif;max-width:1300px;margin:0 auto;padding:20px;background:#f5f5f5}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}
.card{background:#fff;border-radius:10px;padding:14px 20px;box-shadow:0 1px 4px #ccc;min-width:150px}
.card b{display:block;font-size:22px;margin-top:4px}
.up{color:#c0392b}.dn{color:#1e8449}
table{border-collapse:collapse;width:100%;background:#fff;margin:10px 0}
th,td{border:1px solid #ddd;padding:6px 9px;text-align:center;font-size:13px}
th{background:#f0ead6}
#ec{width:100%;height:480px;background:#fff;border:1px solid #ddd;border-radius:8px;margin:10px 0}
.note{background:#fff8e1;border:1px solid #b8860b;border-radius:8px;padding:10px 16px;line-height:1.7;font-size:13px}
.tag{padding:2px 10px;border-radius:4px;color:#fff;font-size:13px}
.tL{background:#d43f3a}.tS{background:#3a9b5c}
.sym{cursor:pointer;padding:3px 10px;border-radius:5px;margin:2px;display:inline-block;background:#eee}
.sym.on{background:#b8860b;color:#fff}
</style></head><body>
<h2>有色截面多空配置 · 实盘监控 <span style="font-size:14px;color:#888">（每日收盘后刷新）</span></h2>
<div class="note" id="note"></div>
<div class="cards" id="cards"></div>
<div id="ec"></div>
<div style="margin:8px 0" id="posbox"></div>
<div style="margin:8px 0" id="symbox"></div>
<div id="bd"></div>
<h3>调仓记录（近30条）</h3><div id="ev"></div>
<script>
const D = {"sig_date": "2026-09-18", "capital": 10000000, "equity": 10000000.0, "cum": 0.0, "today_pnl": 0.0, "ann": null, "sharpe": null, "mdd": 0.0, "curve": [["2026-09-18", 10000000.0]], "scores": [["锡", 0.802], ["镍", 0.594], ["铜", 0.552], ["铅", 0.245], ["锌", -0.473], ["铝", -0.887]], "longs": ["铝", "锌"], "shorts": ["锡", "镍"], "events": [["2026-09-18", "开空", "镍", 0.594], ["2026-09-18", "开空", "锡", 0.802], ["2026-09-18", "开多", "锌", -0.473], ["2026-09-18", "开多", "铝", -0.887]], "breakdown": {"CU": [{"factor": "注销占比", "weight": 0.206, "z": 1.45, "contrib": 0.298}, {"factor": "进口盈亏", "weight": 0.145, "z": 0.71, "contrib": 0.103}, {"factor": "TC", "weight": 0.138, "z": 2.24, "contrib": 0.309}, {"factor": "升贴水", "weight": 0.134, "z": -0.67, "contrib": -0.091}, {"factor": "外盘强弱", "weight": 0.12, "z": 0.48, "contrib": 0.057}, {"factor": "动量", "weight": 0.117, "z": 0.06, "contrib": 0.007}, {"factor": "股商背离", "weight": -0.078, "z": -0.6, "contrib": 0.047}, {"factor": "库存变化", "weight": -0.045, "z": 4.21, "contrib": -0.188}, {"factor": "美元指数", "weight": 0.016, "z": 0.08, "contrib": 0.001}], "AL": [{"factor": "股商背离", "weight": 0.298, "z": -0.83, "contrib": -0.248}, {"factor": "动量", "weight": -0.28, "z": 0.4, "contrib": -0.112}, {"factor": "库存变化", "weight": -0.153, "z": 4.8, "contrib": -0.733}, {"factor": "升贴水", "weight": 0.11, "z": 0.96, "contrib": 0.105}, {"factor": "外盘强弱", "weight": 0.075, "z": 0.05, "contrib": 0.004}, {"factor": "氧化铝价", "weight": 0.034, "z": -0.72, "contrib": -0.025}], "ZN": [{"factor": "外盘强弱", "weight": 0.243, "z": -0.07, "contrib": -0.016}, {"factor": "动量", "weight": -0.23, "z": 1.77, "contrib": -0.406}, {"factor": "TC赤峰", "weight": 0.169, "z": 1.86, "contrib": 0.313}, {"factor": "股商背离", "weight": 0.161, "z": -0.87, "contrib": -0.139}, {"factor": "LME锌0-3", "weight": -0.148, "z": 1.52, "contrib": -0.225}, {"factor": "升贴水", "weight": 0.05, "z": -0.79, "contrib": -0.04}], "PB": [{"factor": "升贴水", "weight": 0.273, "z": 1.51, "contrib": 0.413}, {"factor": "动量", "weight": -0.263, "z": 0.57, "contrib": -0.151}, {"factor": "外盘强弱", "weight": -0.19, "z": -0.28, "contrib": 0.053}, {"factor": "股商背离", "weight": -0.154, "z": -0.73, "contrib": 0.113}, {"factor": "库存变化", "weight": -0.066, "z": 5.05, "contrib": -0.332}, {"factor": "废电瓶价", "weight": -0.054, "z": -1.48, "contrib": 0.081}], "NI": [{"factor": "注销占比", "weight": 0.204, "z": -0.59, "contrib": -0.12}, {"factor": "外盘强弱", "weight": 0.17, "z": -0.02, "contrib": -0.004}, {"factor": "纯镍社库", "weight": 0.164, "z": -1.34, "contrib": -0.219}, {"factor": "升贴水", "weight": 0.156, "z": -0.78, "contrib": -0.122}, {"factor": "库存变化", "weight": 0.155, "z": 11.94, "contrib": 1.856}, {"factor": "镍铁到厂价", "weight": 0.112, "z": 0.8, "contrib": 0.09}, {"factor": "动量", "weight": 0.039, "z": -0.62, "contrib": -0.024}], "SN": [{"factor": "动量", "weight": 0.251, "z": -0.48, "contrib": -0.121}, {"factor": "SOX", "weight": 0.181, "z": -0.81, "contrib": -0.146}, {"factor": "库存变化", "weight": 0.16, "z": 5.0, "contrib": 0.799}, {"factor": "升贴水", "weight": 0.156, "z": -1.44, "contrib": -0.226}, {"factor": "注销占比", "weight": 0.112, "z": 2.89, "contrib": 0.324}, {"factor": "股商背离", "weight": -0.067, "z": -0.22, "contrib": 0.015}, {"factor": "TC云南", "weight": 0.053, "z": -1.14, "contrib": -0.06}, {"factor": "外盘强弱", "weight": 0.02, "z": 0.27, "contrib": 0.006}]}};
const NAMES = ['铜','铝','锌','铅','镍','锡'];
const fmtM = v => (v/10000).toFixed(1) + '万';
document.getElementById('note').innerHTML =
  `信号日 ${D.sig_date} ｜ 起始资金 ${fmtM(D.capital)}（${'2026-09-18'} 起）｜ 规则: 日频IC加权评分→top2多/bottom2空, 滞回1名, 成本0.02%/边, 权重冻结于训练窗(2021-03~2024-06)`;
const cls = v => v >= 0 ? 'up' : 'dn';
document.getElementById('cards').innerHTML =
  `<div class="card">当前资金<b>${fmtM(D.equity)}</b></div>` +
  `<div class="card">累计收益<b class="${cls(D.cum)}">${(D.cum*100).toFixed(2)}%</b></div>` +
  `<div class="card">今日盈亏<b class="${cls(D.today_pnl)}">${fmtM(D.today_pnl)}</b></div>` +
  `<div class="card">年化<b>${D.ann == null ? '—' : (D.ann*100).toFixed(1)+'%'}</b></div>` +
  `<div class="card">Sharpe<b>${D.sharpe == null ? '—' : D.sharpe.toFixed(2)}</b></div>` +
  `<div class="card">最大回撤<b class="dn">${(D.mdd*100).toFixed(1)}%</b></div>`;
document.getElementById('posbox').innerHTML =
  '当前持仓: ' + D.longs.map(s => `<span class="tag tL">多 ${s}</span>`).join(' ') + ' ' +
  D.shorts.map(s => `<span class="tag tS">空 ${s}</span>`).join(' ') +
  '　｜　最新评分: ' + D.scores.map(([n, v]) => `${n} ${v}`).join(' / ');
const ch = echarts.init(document.getElementById('ec'));
ch.setOption({animation: false,
  grid: [{top: 40, height: '60%'}, {top: '74%', height: '16%'}],
  xAxis: [{type: 'category', data: D.curve.map(x => x[0])}, {type: 'category', data: D.curve.map(x => x[0]), gridIndex: 1, show: false}],
  yAxis: [{scale: true, name: '资金(元)'}, {scale: true, gridIndex: 1, name: '日盈亏%'}],
  dataZoom: [{type: 'inside', xAxisIndex: [0,1]}, {type: 'slider', xAxisIndex: [0,1], top: '93%'}],
  tooltip: {trigger: 'axis'},
  series: [
    {name: '资金', type: 'line', data: D.curve.map(x => x[1]), showSymbol: false, areaStyle: {opacity: 0.1}},
    {name: '日盈亏%', type: 'bar', xAxisIndex: 1, yAxisIndex: 1,
     data: D.curve.map((x, i) => i === 0 ? 0 : +((x[1]/D.curve[i-1][1]-1)*100).toFixed(3)),
     itemStyle: {color: p => p.value >= 0 ? '#d43f3a' : '#3a9b5c'}},
  ]});
let sym = 'CU';
const sb = document.getElementById('symbox');
NAMES.forEach((n, i) => { const s = document.createElement('span'); s.className = 'sym' + (i === 0 ? ' on' : '');
  s.textContent = n; s.id = 'sym' + ['CU','AL','ZN','PB','NI','SN'][i];
  s.onclick = () => { sym = ['CU','AL','ZN','PB','NI','SN'][i]; renderBd(); }; sb.appendChild(s); });
function renderBd() {
  ['CU','AL','ZN','PB','NI','SN'].forEach(S => document.getElementById('sym' + S).className = 'sym' + (S === sym ? ' on' : ''));
  const rows = D.breakdown[sym] || [];
  let t = '<table><tr><th>因子</th><th>权重</th><th>最新z</th><th>贡献</th></tr>';
  rows.forEach(r => t += `<tr><td>${r.factor}</td><td>${(r.weight*100).toFixed(0)}%</td><td>${r.z}</td><td>${r.contrib}</td></tr>`);
  document.getElementById('bd').innerHTML = t + '</table>';
}
renderBd();
document.getElementById('ev').innerHTML = '<table><tr><th>日期</th><th>动作</th><th>品种</th><th>评分</th></tr>' +
  D.events.map(e => `<tr><td>${e[0]}</td><td class="${e[1].includes('多') ? 'up' : 'dn'}">${e[1]}</td><td>${e[2]}</td><td>${e[3]}</td></tr>`).join('') + '</table>';
</script></body></html>
