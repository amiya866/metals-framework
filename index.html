  .layer.open .l-arrow{transform:rotate(90deg)}

function starCodes(comm){ return comm.upgrades.map(u => (u.match(/^[\d.]+/)||[""])[0]).filter(Boolean); }
function isStar(comm, no){ return starCodes(comm).some(c => no === c || no.startsWith(c + ".")); }

function cardHtml(n, comm){
  const src = comm && comm.ov[n.no] ? comm.ov[n.no] : n.s;
  const star = comm && isStar(comm, n.no);
  const search = (n.no+n.name+n.q+n.c+src).replace(/<[^>]+>/g,'');
  const imgs = comm ? (commCharts(comm)||[]).filter(c=>c.n===n.no) : [];
  const imgHtml = imgs.map(c=>`<img src="${encodeURI(c.p)}" style="width:100%;margin-top:8px;border:1px solid var(--line);border-radius:4px" loading="lazy" title="${c.t}">`).join('');
  return `<div class="ncard${star?' star':''}" id="n${n.no.replace(/\./g,'_')}" data-search="${search}">
    <h4 onclick="this.parentElement.classList.toggle('collapsed')"><span class="no">${n.no}</span>${n.name}${star?'<span class="starlab">★特色</span>':''}<span class="freq ${n.freq[1]}">${n.freq[0]}</span><span class="attr">[${n.attr}]</span><span class="caret">▾</span></h4>

    <div class="qa">Q｜${n.q}</div>
    <div class="kv"><b>内容</b>｜${n.c}</div>
    <div class="src"><b>数据源</b>｜${src}</div>
    ${imgHtml}
    </div>
  </div>`;
}

      <div class="anchor-banner"><div class="lab">定价锚 · PRICING ANCHOR</div><p>${comm.anchor}</p></div>
      <div class="gtitle" id="ov-up">升级为独立章节的节点 <span class="en">UPGRADES</span></div>
      <div class="cards2">${comm.upgrades.map(u=>`<div class="ncard star"><div class="kv"><span class="starlab">★</span> ${u}</div></div>`).join('')}</div>
      <div class="gtitle" id="ov-src">专属数据源 / ID <span class="en">SOURCES</span></div>
      <div class="ncard"><div class="kv">${comm.src}</div></div>
      <div class="gtitle" id="ov-red">口径红线 <span class="en">CALIBER</span></div>
      <div class="ncard"><div class="kv">${comm.red}</div></div>
      <div class="gtitle" id="ov-gap">缺口 <span class="en">GAPS</span></div>
      <div class="ncard"><div class="kv">${comm.gap}</div></div>`;
  } else {
    const nodes = NODES.filter(n=>n.mod===mid);
    const groups = [...new Set(nodes.map(n=>n.grp))];
    side = groups.map(g => `<div class="grp">${g}</div>` + nodes.filter(n=>n.grp===g).map(n=>`<a onclick="document.getElementById('n${n.no.replace(/\./g,'_')}').scrollIntoView({behavior:'smooth'})">${n.no} ${n.name}</a>`).join('')).join('');
    content = `<div class="anchor-banner" style="border-left-color:${comm.color}"><div class="lab" style="color:${comm.color}">${comm.code} · ${comm.name} · ${MODULES.find(m=>m.id===mid).name}</div><p style="font-size:12.5px;color:var(--ink2)">${comm.anchorS}</p></div>`;
    for (const g of groups){
      content += `<div class="gtitle">${g}</div><div class="cards3">${nodes.filter(n=>n.grp===g).map(n=>cardHtml(n, comm)).join('')}</div>`;
    }
  }
  $app.innerHTML = `<div class="board"><div class="sidebar">${side}</div><div class="content">${content}</div></div>`;
}

function renderTree(){
  $pills.style.display='none';
  $mtabs.innerHTML = `<a class="mtab" href="#/">数据入口</a><div class="mtab active">通用目录树</div><a class="mtab" href="#/matrix">需求矩阵</a><a class="mtab" href="#/sources">数据源体系</a>`;
  const TREE = [
   ["0","品种身份证"],["1","综述与策略（输出层）"],["2","行情与价格体系"],["3","供应"],["4","库存"],["5","需求"],["6","进出口"],["7","成本与利润"],["8","供需平衡"],["9","宏观与联动"],["10","数据资产台账"]];
  let th = `<div class="tree-actions"><a id="exA">全部展开</a><a id="coA">全部收起</a></div>`;
  for (const [code, name] of TREE){
    const kids = NODES.filter(n => n.no === code || n.no.startsWith(code + "."));
    // 按中间层分组（3.1.1 → 3.1；2.1 这类两层节点直接挂顶层）
    const mids = [];
    for (const k of kids){
      const parts = k.no.split(".");
      const mid = parts.length >= 3 ? parts[0] + "." + parts[1] : null;
      let g = mids.find(m => m.mid === mid);
      if (!g){ g = {mid, grp: mid ? k.grp : null, items: []}; mids.push(g); }
      g.items.push(k);
    }
    th += `<div class="t-item"><div class="t-head"><span class="t-arrow">▼</span><span class="t-code">${code}</span><span class="t-name">${name}</span><span class="attr">${kids.length} 项</span></div><div class="t-kids t-item">`;
    for (const g of mids){
      if (g.mid){
        th += `<div class="t-item"><div class="t-head"><span class="t-arrow">▼</span><span class="t-code">${g.mid}</span><span class="t-name" style="font-weight:500">${g.grp}</span><span class="attr">${g.items.length} 项</span></div><div class="t-kids t-item">`;
        for (const k of g.items) th += `<div class="t-desc link" onclick="jumpNode('${k.no.replace(/\./g,'_')}')"><b style="color:var(--accent)">${k.no}</b> ${k.name}｜${k.q}</div>`;
        th += `</div></div>`;
      } else {
        for (const k of g.items) th += `<div class="t-desc link" onclick="jumpNode('${k.no.replace(/\./g,'_')}')"><b style="color:var(--accent)">${k.no}</b> ${k.name}｜${k.q}</div>`;
      }
    }
    th += `</div></div>`;
  }
  $app.innerHTML = `<div class="page"><h2>通用目录树</h2><p class="lead">点击节点展开/收起。下方卡片为每个末级节点的完整说明（通用口径；品种专属数据源见各品种看板）。</p>
    <input id="search" placeholder="搜索节点 / 数据源 / 指标ID …（如 TC、仓单、排产、ID01320080）">
    <div class="tree">${th}</div>
    <div class="gtitle" style="margin-top:26px">节点详解</div>
    <div class="cards3" id="allcards">${NODES.map(n=>cardHtml(n, null).replace('class="ncard', 'class="ncard collapsed')).join('')}</div></div>`;
  document.querySelectorAll('.t-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('closed'));
  document.getElementById('exA').onclick = () => document.querySelectorAll('.t-item').forEach(i=>i.classList.remove('closed'));
  document.getElementById('coA').onclick = () => document.querySelectorAll('.tree > .t-item').forEach(i=>i.classList.add('closed'));
  document.getElementById('search').oninput = function(){
    const q = this.value.trim().toLowerCase();
    document.querySelectorAll('#allcards .ncard').forEach(c => c.classList.toggle('hidden-by-search', q && !c.dataset.search.toLowerCase().includes(q)));
  };
}

function renderMatrix(){
  $pills.style.display='none';
  $mtabs.innerHTML = `<a class="mtab" href="#/">数据入口</a><a class="mtab" href="#/tree">通用目录树</a><div class="mtab active">需求矩阵</div><a class="mtab" href="#/sources">数据源体系</a>`;
  let mh = `<tr>${MATRIX.head.map(h=>`<th>${h}</th>`).join('')}</tr>`;
  for (const r of MATRIX.rows){
    mh += `<tr><td><b>${r[0]}</b></td><td class="ind">${r[1]}</td><td class="ind">${r[2]}</td>` + r.slice(3).map(v=>`<td class="${v==='●●'?'d2':(v==='●'?'d1':'')}">${v||'—'}</td>`).join('') + `</tr>`;
  }
  $app.innerHTML = `<div class="page"><h2>需求结构矩阵（品种 × 宏观主线）</h2>
    <p class="lead">终端消费按宏观主线归组而非按品种切碎：同主线品种联动验证（半导体回升时锡弹性应大于铜）；一强一弱给比价交易线索；新品种接入先填矩阵位置。</p>
    <div class="tbl-wrap"><table>${mh}</table></div>
    <p class="legend"><span class="d2">●●</span> = 主力需求（第一大下游）　<span class="d1">●</span> = 重要需求　— = 占比小或间接<br>注：${MATRIX.note}</p></div>`;
}

function renderSources(){
  $pills.style.display='none';
  $mtabs.innerHTML = `<a class="mtab" href="#/">数据入口</a><a class="mtab" href="#/tree">通用目录树</a><a class="mtab" href="#/matrix">需求矩阵</a><div class="mtab active">数据源体系</div>`;
  $app.innerHTML = `<div class="page"><h2>数据来源体系（五层优先级）</h2>
    <p class="lead">查任何数据按 L1→L5 顺序：高层拿不到再往下走；引用低层数据必须标注来源属性。</p>
    ${LAYERS.map(l=>`<div class="layer"><div class="layer-head"><span class="l-badge ${l.cls}">${l.badge}</span><span class="l-title">${l.title}</span><span class="l-sub">${l.sub}</span><span class="l-arrow">▶</span></div><div class="layer-body">${l.body}</div></div>`).join('')}
    <div class="gtitle" style="margin-top:26px">跨品种共享资产</div>
    <div class="cards2">${SHARED.map(([n,d])=>`<div class="ncard"><h4>${n}</h4><div class="kv">${d}</div></div>`).join('')}</div></div>`;
  document.querySelectorAll('.layer-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('open'));
}

function jumpNode(id){
  const el = document.getElementById('n' + id);
  if (!el) return;
  el.classList.remove('collapsed');
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function render(){
  const h = location.hash || "#/";
  const parts = h.replace(/^#\//,'').split('/');
  window.scrollTo(0,0);
  if (parts[0] === "c") renderBoard(parts[1], parts[2]);
  else if (parts[0] === "tree") renderTree();
  else if (parts[0] === "matrix") renderMatrix();
  else if (parts[0] === "sources") renderSources();
  else renderHome();
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
