function renderTree(){
  setNav('tree');
  const TREE = [
   ["0","品种身份证"],["1","综述与策略（输出层）"],["2","行情与价格体系"],["3","供应"],["4","库存"],["5","需求"],["6","进出口"],["7","成本与利润"],["8","供需平衡"],["9","宏观与联动"],["10","数据资产台账"]];
  let th = `<div class="tree-actions"><a id="exA">全部展开</a><a id="coA">全部收起</a></div>`;
  for (const [code, name] of TREE){
    const kids = NODES.filter(n => n.no === code || n.no.startsWith(code + "."));
    // 按中间层分组（3.1.1 → 3.1；2.1 这类两层节点直接挂顶层）
    const mids = [];
    for (const k of kids){
      const parts = k.no.split(".");
      const mid = parts.length >= 3 ? parts[0] + "." + parts[1] : null;
      let g = mids.find(m => m.mid === mid);
      if (!g){ g = {mid, grp: mid ? k.grp : null, items: []}; mids.push(g); }
      g.items.push(k);
    }
    th += `<div class="t-item"><div class="t-head"><span class="t-arrow">▼</span><span class="t-code">${code}</span><span class="t-name">${name}</span><span class="attr">${kids.length} 项</span></div><div class="t-kids t-item">`;
    for (const g of mids){
      if (g.mid){
        th += `<div class="t-item"><div class="t-head"><span class="t-arrow">▼</span><span class="t-code">${g.mid}</span><span class="t-name" style="font-weight:500">${g.grp}</span><span class="attr">${g.items.length} 项</span></div><div class="t-kids t-item">`;
        for (const k of g.items) th += `<div class="t-desc link" onclick="jumpNode('${k.no.replace(/\./g,'_')}')"><b style="color:var(--accent)">${k.no}</b> ${k.name}｜${k.q}</div>`;
        th += `</div></div>`;
      } else {
        for (const k of g.items) th += `<div class="t-desc link" onclick="jumpNode('${k.no.replace(/\./g,'_')}')"><b style="color:var(--accent)">${k.no}</b> ${k.name}｜${k.q}</div>`;
      }
    }
    th += `</div></div>`;
  }
  $app.innerHTML = `<div class="page"><h2>通用目录树</h2><p class="lead">点击节点展开/收起。下方卡片为每个末级节点的完整说明（通用口径；品种专属数据源见各品种看板）。</p>
    <input id="search" placeholder="搜索节点 / 数据源 / 指标ID …（如 TC、仓单、排产、ID01320080）">
    <div class="tree">${th}</div>
    <div class="gtitle" style="margin-top:26px">节点详解</div>
    <div class="cards3" id="allcards">${NODES.map(n=>cardHtml(n, null).replace('class="ncard', 'class="ncard collapsed')).join('')}</div></div>`;
  document.querySelectorAll('.t-head').forEach(h => h.onclick = () => h.parentElement.classList.toggle('closed'));
  document.getElementById('exA').onclick = () => document.querySelectorAll('.t-item').forEach(i=>i.classList.remove('closed'));
  document.getElementById('coA').onclick = () => document.querySelectorAll('.tree > .t-item').forEach(i=>i.classList.add('closed'));
  document.getElementById('search').oninput = function(){
    const q = this.value.trim().toLowerCase();
    document.querySelectorAll('#allcards .ncard').forEach(c => c.classList.toggle('hidden-by-search', q && !c.dataset.search.toLowerCase().includes(q)));
  };
}

function macroDash(){
  const all = [];
  for (const c of COMMS) for (const ch of (commCharts(c) || [])) all.push(ch);
  const groups = MACRO_GROUPS.map(([gname, keys]) => {
    const items = [];
    for (const k of keys){
      const ch = all.find(x => x.t && x.t.includes(k));
      if (ch) items.push(ch);
    }
    if (!items.length) return '';
    const chips = items.map(ch => `<span class="macro-chip">${ch.t.replace(/（.*?）/g,'')} <b>${ch.latest !== undefined ? (+ch.latest).toLocaleString() : ''}</b><i>${ch.end || ''}</i></span>`).join('');
    const imgs = items.map(ch => `<div class="ncard" style="padding:8px 10px"><h4 style="font-size:12.5px;margin-bottom:4px">${ch.t}<span class="freq f-m">${ch.k}</span></h4><img src="${encodeURI(ch.p)}" style="width:100%;border:1px solid var(--line);border-radius:4px" loading="lazy"></div>`).join('');
    return `<div class="gtitle" style="margin-top:14px">${gname}</div><div style="margin-bottom:6px">${chips}</div><div class="cards3">${imgs}</div>`;
  }).join('');
  return `<div class="anchor-banner"><div class="lab">宏观需求仪表盘（跨品种汇总）</div><p style="font-size:12.5px;color:var(--ink2)">地产 / 汽车 / 电网 / 新能源 / 电子 / 家电 / 宏观环境——各主线最新读数与走势，下钻到矩阵行或品种明细</p></div>${groups}`;
}

  $mtabs.innerHTML = `<a class="mtab${route==='home'?' active':''}" href="#/">数据入口</a>` +
    Object.entries(MODULE_TITLES).map(([id, t]) =>
      `<a class="mtab${route==='module'&&mid===id?' active':''}" href="#/m/${id}">${t}</a>`).join('') +

    `<a class="mtab${route==='matrix'?' active':''}" href="#/matrix">需求矩阵</a>` +
    `<a class="mtab${route==='sources'?' active':''}" href="#/sources">数据源体系</a>` +

    `<a class="mtab${route==='equity'?' active':''}" href="#/equity">权益端</a>` +
    `<a class="mtab${route==='ds'?' active':''}" href="#/ds">数据看板</a>`;

    `<a class="pill${route==='comm'&&cid===c.id?' active':''}" href="#/c/${c.id}${mid?'/'+mid:''}">${c.code} ${c.name.replace('数据面板','')}</a>`).join('');
  if (route === 'comm'){
    const comm = COMMS.find(c=>c.id===cid) || COMMS[0];

    $subtabs.style.display = 'block';

const NODE_MOD = {};
const NODE_NAME = {};
NODES.forEach(n => { NODE_MOD[n.no] = n.mod; NODE_NAME[n.no] = n.name; });
const MODULE_TITLES = {price:"价格", supply:"供应", inventory:"库存", demand:"需求", trade:"进出口", cost:"成本·利润", balance:"供需平衡", macro:"宏观"};

function renderModule(mod){
  if (!MODULE_TITLES[mod]) mod = "supply";
  setNav('module', null, mod);
  const present = [];
  for (const c of COMMS){
    const chs = (commCharts(c) || []).filter(ch => NODE_MOD[ch.n] === mod);
    if (chs.length) present.push([c, chs]);
  }
  if (mod === "macro" && window.CHARTS && CHARTS.macro && CHARTS.macro.length)
    present.unshift([{id:"macro", code:"MACRO", name:"全球宏观", color:"#8a6f9c"}, CHARTS.macro]);
  const side = present.map(([c, chs]) =>
    `<a onclick="document.getElementById('mc-${c.id}').scrollIntoView({behavior:'smooth'})"><span style="color:${c.color}">■</span> ${c.code} ${c.name.replace('数据面板','')}<span style="float:right;color:var(--ink2)">${chs.length}</span></a>`).join('');
  let content = `<div class="anchor-banner"><div class="lab">板块总览 · ${MODULE_TITLES[mod]}</div><p style="font-size:12.5px;color:var(--ink2)">按品种分类（铜/铝/铅/锌/镍/锡/锂/硅），图嵌在对应框架节点上；点左侧品种跳转</p></div>`;
  if (mod === "macro" && window.CHARTS && CHARTS.macro){
    const grps = {};
    for (const ch of CHARTS.macro){ (grps[ch.grp || "其他"] = grps[ch.grp || "其他"] || []).push(ch); }
    content += `<div class="gtitle" id="mc-macro"><span style="color:#8a6f9c">MACRO</span> 全球宏观 <span class="en">${CHARTS.macro.length} 图</span></div>`;
    for (const [g, items] of Object.entries(grps)){
      content += `<div class="gtitle" style="font-size:13px">${g}</div><div class="cards3">` + items.map(ch =>
        `<div class="ncard" style="padding:10px 12px"><h4 style="font-size:13px;margin-bottom:4px">${ch.t}<span class="freq f-m">${ch.k}</span></h4><img src="${encodeURI(ch.p)}" style="width:100%;border:1px solid var(--line);border-radius:4px" loading="lazy"><div class="src" style="margin-top:5px">来源：${ch.src} ｜ 数据至 ${ch.end}</div></div>`).join('') + `</div>`;
    }
  }
  for (const [c, chs] of present){
    content += `<div class="gtitle" id="mc-${c.id}"><span style="color:${c.color}">${c.code}</span> ${c.name.replace('数据面板','')} <span class="en">${chs.length} 图</span></div><div class="cards3">` +
      chs.map(ch => `<div class="ncard" style="padding:10px 12px"><h4 style="margin-bottom:4px;font-size:13px">${ch.t}<span class="freq f-m">${ch.k}</span></h4><div style="font-size:11px;color:var(--accent);margin-bottom:5px">${ch.n && ch.n !== '0' ? ch.n + ' ' + (NODE_NAME[ch.n] || '') : ''}</div><img src="${encodeURI(ch.p)}" style="width:100%;border:1px solid var(--line);border-radius:4px" loading="lazy"><div class="src" style="margin-top:5px">来源：${ch.src} ｜ 数据至 ${ch.end}</div></div>`).join('') + `</div>`;
  }
  $app.innerHTML = `<div class="board"><div class="sidebar">${side}</div><div class="content">${content}</div></div>`;
}

function seatCard(cid){
  const ss = (window.SEAT_SUMMARY || {}).data || {};
  const f = ss[cid.toUpperCase()];
  if (!f) return '';
  const rows = Object.entries(f).map(([name, v]) => {
    const col = v.net > 500 ? '#b4453a' : (v.net < -500 ? '#2f7d4f' : '#6b6762');
    const flow = v.flow || '';
    return `<div class="kv"><b>${name}</b>｜<span style="color:${col};font-weight:600">${v.dir} ${v.net > 0 ? '+' : ''}${v.net.toLocaleString()}</span> 手　<span style="color:var(--ink2)">5日 ${v.d5 !== null ? (v.d5 >= 0 ? '+' : '') + v.d5.toLocaleString() + ' ' + flow : '—'}｜20日 ${v.d20 !== null ? (v.d20 >= 0 ? '+' : '') + v.d20.toLocaleString() : '—'}</span></div>`;
  }).join('');
  return `<div class="gtitle" style="margin-top:0">资金席位（${(window.SEAT_SUMMARY || {}).date || ''} 交易所会员排名）
    <a class="track-chip" style="float:right" onclick="goNode('${cid}','price','n2_6')">席位观察图 →</a></div>
    <div class="ncard" style="margin-bottom:14px">${rows}</div>`;
}

function goNode(cid, mid, nid){
  location.hash = `#/c/${cid}/${mid}`;
  setTimeout(() => {
    const el = document.getElementById(nid);
    if (el){
      el.classList.remove('collapsed');
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
  }, 450);
}

function renderContra(cid){

  const rcards = d.r.map(r => `
    <div class="ncard risk-card">
      <div class="kv"><b>⚠ ${r.t}</b>｜触发条件：${r.f}</div>
      ${r.tr.length ? `<div class="kv">验证：${r.tr.map(t => `<a class="track-chip" onclick="goNode('${t[1]}','${t[2]}','${t[3]}')">${t[0]} →</a>`).join(' ')}</div>` : ''}
    </div>`).join('');
  $app.innerHTML = `<div class="board"><div class="sidebar"><div class="grp">品种（定调）</div>${side}</div>
    <div class="content">
      <div class="anchor-banner dir-${d.tone}" style="border-left-color:${comm.color}">

      ${rcards}
    </div></div>`;
  // 默认展开第一张矛盾卡
  const first = document.querySelector('.contra-card');
  if (first) first.classList.add('open');
}

  const el = document.getElementById('n' + id);
  if (!el) return;
  el.classList.remove('collapsed');
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

    <div class="kv"><b>财务质量备注</b>｜已沉淀在平台各品种表（云锡 11.45%、中铝原铝 18.88%、神火 30.06%、华友 19.7%+现金流背离、力勤湿法 39.3%/火法 14.6%、格林美 18.13% 等，详见 映射总表「已安装财报分析 skills」节）。</div>

    <div class="ncard"><div class="kv" style="color:var(--ink2)">预留位：用户的内容/观点平台接入后，此处按品种展示最新小作文流（结构同 news.json：date/commodity/title/summary/source/url + impact）。接入时提供数据格式即可挂接。</div></div>
    </div></div>`;

function render(){
  const h = location.hash || "#/";
  const parts = h.replace(/^#\//,'').split('/');
  window.scrollTo(0,0);
  if (parts[0] === "m") renderModule(parts[1]);
  else if (parts[0] === "c") renderBoard(parts[1], parts[2]);
  else if (parts[0] === "tree") renderTree();
  else if (parts[0] === "matrix") renderMatrix();
  else if (parts[0] === "sources") renderSources();
  else if (parts[0] === "equity") renderEquity();
  else if (parts[0] === "contra") renderContra(parts[1]);
  else if (parts[0] === "ds") renderDs();
  else renderHome();
}
window.addEventListener('hashchange', render);
render();
</script>
